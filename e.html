<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>444 Store</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

<style>

/* =========================
   RESET
========================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:'Inter',sans-serif;
  background:#fff;
  color:#111;
  overflow-x:hidden;
}

/* =========================
   NAVBAR
========================= */

.navbar{
  position:sticky;
  top:0;
  z-index:999;
  height:75px;
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(0,0,0,.06);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
}

.logo{
  font-size:28px;
  font-weight:800;
  letter-spacing:4px;
}

.nav-icons{
  display:flex;
  align-items:center;
  gap:18px;
}

.icon-btn{
  width:42px;
  height:42px;
  border-radius:14px;
  border:none;
  background:#f4f4f4;
  cursor:pointer;
  transition:.3s;
  position:relative;
}

.icon-btn:hover{
  background:#111;
  color:#fff;
}

.icon-btn i{
  font-size:16px;
}

.cart-count{
  position:absolute;
  top:-5px;
  right:-5px;
  width:20px;
  height:20px;
  background:#111;
  color:#fff;
  border-radius:50%;
  font-size:11px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* =========================
   PAGE
========================= */

.page{
  max-width:1400px;
  margin:auto;
  padding:30px 18px 120px;
}

.page-title{
  margin-bottom:30px;
}

.page-title h1{
  font-size:48px;
  font-weight:800;
  line-height:1;
  margin-bottom:10px;
}

.page-title p{
  color:#666;
  font-size:15px;
}

/* =========================
   PRODUCTS GRID
========================= */

.products-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:24px;
}

.product-card{
  cursor:pointer;
  transition:.4s;
}

.product-card:hover{
  transform:translateY(-8px);
}

.product-image{
  position:relative;
  overflow:hidden;
  border-radius:28px;
  background:#f7f7f7;
  aspect-ratio:1/1.15;
  margin-bottom:16px;
}

.product-image img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:1s;
}

.product-card:hover .product-image img{
  transform:scale(1.08);
}

.quick-view{
  position:absolute;
  bottom:15px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(255,255,255,.85);
  backdrop-filter:blur(10px);
  padding:12px 18px;
  border-radius:100px;
  font-size:13px;
  font-weight:600;
  opacity:0;
  transition:.4s;
}

.product-card:hover .quick-view{
  opacity:1;
}

.product-name{
  font-size:18px;
  font-weight:700;
  margin-bottom:8px;
}

.product-sub{
  color:#777;
  font-size:14px;
  margin-bottom:14px;
}

.price-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.price{
  font-size:20px;
  font-weight:800;
}

.rating{
  color:#f5b301;
  font-size:13px;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  z-index:5000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  opacity:0;
  visibility:hidden;
  transition:.4s;
}

.modal.show{
  opacity:1;
  visibility:visible;
}

.modal-box{
  width:100%;
  max-width:1200px;
  background:#fff;
  border-radius:32px;
  overflow:hidden;
  display:grid;
  grid-template-columns:1fr 1fr;
  position:relative;
  max-height:95vh;
}

.modal-left{
  background:#f7f7f7;
  padding:20px;
}

.main-image{
  width:100%;
  height:520px;
  border-radius:24px;
  overflow:hidden;
  margin-bottom:18px;
}

.main-image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.gallery{
  display:flex;
  gap:12px;
}

.gallery img{
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:16px;
  cursor:pointer;
  border:2px solid transparent;
  transition:.3s;
}

.gallery img:hover{
  border-color:#111;
}

.modal-right{
  padding:50px;
  overflow-y:auto;
}

.modal-close{
  position:absolute;
  top:18px;
  right:18px;
  width:45px;
  height:45px;
  border:none;
  border-radius:50%;
  background:#111;
  color:#fff;
  cursor:pointer;
  font-size:16px;
}

.modal-tag{
  color:#777;
  margin-bottom:10px;
  font-size:14px;
}

.modal-title{
  font-size:44px;
  font-weight:800;
  line-height:1;
  margin-bottom:18px;
}

.modal-price{
  font-size:34px;
  font-weight:800;
  margin-bottom:20px;
}

.modal-desc{
  color:#666;
  line-height:1.8;
  margin-bottom:30px;
}

.modal-stars{
  margin-bottom:25px;
  color:#f5b301;
}

.size-title{
  font-size:14px;
  margin-bottom:14px;
  color:#666;
}

.sizes{
  display:flex;
  gap:12px;
  margin-bottom:35px;
  flex-wrap:wrap;
}

.size-btn{
  width:55px;
  height:55px;
  border-radius:16px;
  border:1px solid #ddd;
  background:#fff;
  font-weight:700;
  cursor:pointer;
  transition:.3s;
}

.size-btn.active{
  background:#111;
  color:#fff;
  border-color:#111;
}

.modal-actions{
  display:flex;
  gap:16px;
}

.add-cart{
  flex:1;
  height:60px;
  border:none;
  background:#111;
  color:#fff;
  border-radius:18px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  transition:.3s;
}

.add-cart:hover{
  transform:translateY(-3px);
}

.wishlist{
  width:60px;
  border:none;
  border-radius:18px;
  background:#f3f3f3;
  cursor:pointer;
  font-size:18px;
}

/* =========================
   CART
========================= */

.cart{
  position:fixed;
  top:0;
  right:-420px;
  width:420px;
  height:100vh;
  background:#fff;
  z-index:6000;
  transition:.5s;
  display:flex;
  flex-direction:column;
  box-shadow:-10px 0 40px rgba(0,0,0,.1);
}

.cart.show{
  right:0;
}

.cart-header{
  height:80px;
  border-bottom:1px solid #eee;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
}

.cart-header h2{
  font-size:22px;
}

.close-cart{
  border:none;
  background:none;
  font-size:20px;
  cursor:pointer;
}

.cart-items{
  flex:1;
  overflow-y:auto;
  padding:20px;
}

.cart-item{
  display:flex;
  gap:14px;
  margin-bottom:18px;
}

.cart-item img{
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:16px;
}

.cart-item h4{
  font-size:15px;
  margin-bottom:5px;
}

.cart-item p{
  color:#777;
  font-size:13px;
  margin-bottom:6px;
}

.cart-footer{
  padding:24px;
  border-top:1px solid #eee;
}

.total{
  display:flex;
  justify-content:space-between;
  margin-bottom:18px;
  font-weight:700;
}

.checkout{
  width:100%;
  height:56px;
  border:none;
  background:#111;
  color:#fff;
  border-radius:18px;
  font-weight:700;
  cursor:pointer;
}

/* =========================
   MOBILE
========================= */

@media(max-width:1000px){

  .products-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .modal-box{
    grid-template-columns:1fr;
    overflow-y:auto;
  }

  .main-image{
    height:400px;
  }

}

@media(max-width:600px){

  .page-title h1{
    font-size:34px;
  }

  .products-grid{
    gap:18px;
  }

  .product-name{
    font-size:15px;
  }

  .price{
    font-size:17px;
  }

  .gallery img{
    width:70px;
    height:70px;
  }

  .modal-right{
    padding:30px 22px;
  }

  .modal-title{
    font-size:32px;
  }

  .modal-price{
    font-size:28px;
  }

  .cart{
    width:100%;
  }

}

</style>
</head>
<body>

<!-- NAVBAR -->

<nav class="navbar">

  <div class="logo">444</div>

  <div class="nav-icons">

    <button class="icon-btn">
      <i class="fas fa-search"></i>
    </button>

    <button class="icon-btn">
      <i class="fas fa-user"></i>
    </button>

    <button class="icon-btn" id="cartBtn">

      <i class="fas fa-shopping-bag"></i>

      <div class="cart-count" id="cartCount">0</div>

    </button>

  </div>

</nav>

<!-- PAGE -->

<div class="page">

  <div class="page-title">
    <h1>All Products</h1>
    <p>Luxury streetwear crafted for modern culture.</p>
  </div>

  <div class="products-grid" id="productsGrid"></div>

</div>

<!-- MODAL -->

<div class="modal" id="modal">

  <div class="modal-box">

    <button class="modal-close" id="closeModal">
      <i class="fas fa-times"></i>
    </button>

    <div class="modal-left">

      <div class="main-image">
        <img id="modalMainImage" src="">
      </div>

      <div class="gallery" id="gallery"></div>

    </div>

    <div class="modal-right">

      <div class="modal-tag" id="modalSub">444 Collection</div>

      <h2 class="modal-title" id="modalTitle"></h2>

      <div class="modal-stars">
        <i class="fas fa-star"></i>
        <i class="fas fa-star"></i>
        <i class="fas fa-star"></i>
        <i class="fas fa-star"></i>
        <i class="fas fa-star-half-alt"></i>
        <span style="color:#666;">4.8</span>
      </div>

      <div class="modal-price" id="modalPrice"></div>

      <p class="modal-desc">
        Premium luxury streetwear designed with oversized silhouettes, cinematic aesthetics and modern street culture inspiration.
      </p>

      <div class="size-title">Select Size</div>

      <div class="sizes">

        <button class="size-btn">M</button>
        <button class="size-btn">L</button>
        <button class="size-btn">XL</button>
        <button class="size-btn">2XL</button>
        <button class="size-btn">3XL</button>

      </div>

      <div class="modal-actions">

        <button class="add-cart" id="addCartBtn">
          <i class="fas fa-shopping-bag"></i>
          Add To Cart
        </button>

        <button class="wishlist">
          <i class="far fa-heart"></i>
        </button>

      </div>

    </div>

  </div>

</div>

<!-- CART -->

<div class="cart" id="cart">

  <div class="cart-header">

    <h2>Your Cart</h2>

    <button class="close-cart" id="closeCart">
      <i class="fas fa-times"></i>
    </button>

  </div>

  <div class="cart-items" id="cartItems"></div>

  <div class="cart-footer">

    <div class="total">
      <span>Total</span>
      <span id="cartTotal">GH₵0</span>
    </div>

    <button class="checkout">
      Checkout
    </button>

  </div>

</div>

<script>

/* =========================
   PRODUCTS
========================= */

const products = [

{
  id:1,
  name:"444 Oversized Tee",
  sub:"Luxury Streetwear",
  price:150,
  image:"https://raw.githubusercontent.com/fourfourfourbrand444/444brand/main/bwf.jpg",
  gallery:[
    "https://raw.githubusercontent.com/fourfourfourbrand444/444brand/main/bwf.jpg",
    "https://raw.githubusercontent.com/fourfourfourbrand444/444brand/main/bwf.jpg",
    "https://raw.githubusercontent.com/fourfourfourbrand444/444brand/main/bwf.jpg",
    "https://raw.githubusercontent.com/fourfourfourbrand444/444brand/main/bwf.jpg"
  ]
},

{
  id:2,
  name:"444 Shadow Hoodie",
  sub:"New Collection",
  price:150,
  image:"https://raw.githubusercontent.com/fourfourfourbrand444/444brand/main/bwf.jpg",
  gallery:[
    "https://raw.githubusercontent.com/fourfourfourbrand444/444brand/main/bwf.jpg",
    "https://raw.githubusercontent.com/fourfourfourbrand444/444brand/main/bwf.jpg",
    "https://raw.githubusercontent.com/fourfourfourbrand444/444brand/main/bwf.jpg",
    "https://raw.githubusercontent.com/fourfourfourbrand444/444brand/main/bwf.jpg"
  ]
},

{
  id:3,
  name:"444 Essential Tee",
  sub:"Premium Drop",
  price:150,
  image:"https://raw.githubusercontent.com/fourfourfourbrand444/444brand/main/bwf.jpg",
  gallery:[
    "https://raw.githubusercontent.com/fourfourfourbrand444/444brand/main/bwf.jpg",
    "https://raw.githubusercontent.com/fourfourfourbrand444/444brand/main/bwf.jpg",
    "https://raw.githubusercontent.com/fourfourfourbrand444/444brand/main/bwf.jpg",
    "https://raw.githubusercontent.com/fourfourfourbrand444/444brand/main/bwf.jpg"
  ]
},

{
  id:4,
  name:"444 Black Fit",
  sub:"Street Series",
  price:150,
  image:"https://raw.githubusercontent.com/fourfourfourbrand444/444brand/main/bwf.jpg",
  gallery:[
    "https://raw.githubusercontent.com/fourfourfourbrand444/444brand/main/bwf.jpg",
    "https://raw.githubusercontent.com/fourfourfourbrand444/444brand/main/bwf.jpg",
    "https://raw.githubusercontent.com/fourfourfourbrand444/444brand/main/bwf.jpg",
    "https://raw.githubusercontent.com/fourfourfourbrand444/444brand/main/bwf.jpg"
  ]
}

];

/* =========================
   RENDER PRODUCTS
========================= */

const productsGrid = document.getElementById("productsGrid");

products.forEach(product=>{

const card=document.createElement("div");

card.className="product-card";

card.innerHTML=`

<div class="product-image">

<img src="${product.image}">

<div class="quick-view">
<i class="fas fa-eye"></i>
Quick View
</div>

</div>

<div class="product-name">
${product.name}
</div>

<div class="product-sub">
${product.sub}
</div>

<div class="price-row">

<div class="price">
GH₵${product.price}
</div>

<div class="rating">
<i class="fas fa-star"></i>
4.8
</div>

</div>

`;

card.addEventListener("click",()=>openModal(product));

productsGrid.appendChild(card);

});

/* =========================
   MODAL
========================= */

const modal=document.getElementById("modal");

const modalMainImage=document.getElementById("modalMainImage");

const modalTitle=document.getElementById("modalTitle");

const modalSub=document.getElementById("modalSub");

const modalPrice=document.getElementById("modalPrice");

const gallery=document.getElementById("gallery");

let currentProduct=null;

function openModal(product){

currentProduct=product;

modal.classList.add("show");

modalMainImage.src=product.image;

modalTitle.innerText=product.name;

modalSub.innerText=product.sub;

modalPrice.innerText=`GH₵${product.price}`;

gallery.innerHTML="";

product.gallery.forEach(img=>{

const image=document.createElement("img");

image.src=img;

image.onclick=()=>{
modalMainImage.src=img;
};

gallery.appendChild(image);

});

document.body.style.overflow="hidden";

}

document.getElementById("closeModal").onclick=()=>{

modal.classList.remove("show");

document.body.style.overflow="auto";

};

modal.addEventListener("click",(e)=>{

if(e.target===modal){

modal.classList.remove("show");

document.body.style.overflow="auto";

}

});

/* =========================
   SIZES
========================= */

const sizeButtons=document.querySelectorAll(".size-btn");

let selectedSize="M";

sizeButtons.forEach(btn=>{

btn.onclick=()=>{

sizeButtons.forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

selectedSize=btn.innerText;

};

});

sizeButtons[0].classList.add("active");

/* =========================
   CART
========================= */

let cart=[];

const cartBtn=document.getElementById("cartBtn");

const cart=document.getElementById("cart");

const closeCart=document.getElementById("closeCart");

cartBtn.onclick=()=>{

cart.classList.add("show");

};

closeCart.onclick=()=>{

cart.classList.remove("show");

};

document.getElementById("addCartBtn").onclick=()=>{

if(!currentProduct) return;

cart.push({
...currentProduct,
size:selectedSize
});

updateCart();

modal.classList.remove("show");

cart.classList.add("show");

};

/* =========================
   UPDATE CART
========================= */

function updateCart(){

document.getElementById("cartCount").innerText=cart.length;

const cartItems=document.getElementById("cartItems");

cartItems.innerHTML="";

let total=0;

cart.forEach((item,index)=>{

total+=item.price;

const div=document.createElement("div");

div.className="cart-item";

div.innerHTML=`

<img src="${item.image}">

<div>

<h4>${item.name}</h4>

<p>Size: ${item.size}</p>

<p>GH₵${item.price}</p>

</div>

`;

cartItems.appendChild(div);

});

document.getElementById("cartTotal").innerText=`GH₵${total}`;

}

</script>

</body>
</html>
